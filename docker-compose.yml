services:
  daizen-postgres:
    image: postgres:15-alpine
    container_name: daizen-postgres
    env_file:
      - .env  # 🌟 신규: environment 대신 .env 파일 사용
    ports:
      - "5432:5432"
    volumes:
      - daizen_postgres_data:/var/lib/postgresql/data
    restart: always

  daizen-redis:
    image: redis:7-alpine
    container_name: daizen-redis
    ports:
      - "6379:6379"
    restart: always

  daizen-backend:
    build: .
    container_name: daizen-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env  # 🌟 신규: environment 대신 .env 파일 사용
    depends_on:
      - daizen-postgres
      - daizen-redis

  daizen-celery:
    build: .
    container_name: daizen-celery
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env  # 🌟 신규: environment 대신 .env 파일 사용
    depends_on:
      - daizen-postgres
      - daizen-redis
      - daizen-backend

volumes:
  daizen_postgres_data: