[project]
name = "tft-train-predict-py"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lightning>=2.6.5",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pytorch-forecasting>=1.8.0",
    "torch==2.7.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
