[project]
name = "daizen-baseline"
version = "0.1.0"
description = "Step-by-step seasonal naive baseline for automobile sales"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lightning==2.6.6",
    "numpy==2.5.3",
    "pandas>=3.0,<4",
    "python-multipart>=0.0.32",
    "pytorch-forecasting==1.8.0",
    "scikit-learn>=1.6,<2",
    "torch==2.8.0",
    "uvicorn>=0.53.0",
    "xgboost>=3.1,<4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
